server:
  port: 8085

spring:
  application:
    name: skystore-core

  datasource:
    url: jdbc:mariadb://localhost:3306/skystore_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8
    username: sky_user
    password: sky_secure_pass
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

  data:
    redis:
      host: "::1"
      port: 6380

  rabbitmq:
    host: localhost
    port: 5673
    username: sky_admin
    password: sky_admin_pass
    template:
      default-receive-queue: orders.queue

  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    cors:
      allowed-origins: "https://api.microshop.local,http://localhost:3000"
      allowed-methods: GET,POST,OPTIONS

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/skystore
          jwk-set-uri: http://localhost:8080/realms/skystore/protocol/openid-connect/certs

grpc:
  client:
    rust-media-service:
      address: 'static://localhost:50051'
      negotiation-type: plaintext

app:
  rabbitmq:
    exchange: orders.exchange
    queue: orders.queue
    routing-key: order.created

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      enabled: true

spring.batch.jdbc.initialize-schema: always