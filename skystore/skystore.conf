# التوجيه التلقائي إلى HTTPS
server {
    listen 80;
    server_name api.skystore.local auth.skystore.local;
    return 301 https://$host$request_uri;
}

# خادم الـ API (Spring Boot GraphQL & WebSockets)
server {
    listen 443 ssl;
    http2 on;
    server_name api.skystore.local;

    ssl_certificate /etc/nginx/certs/skystore.crt;
    ssl_certificate_key /etc/nginx/certs/skystore.key;

    # توجيه طلبات GraphQL
    location /graphql {
        proxy_pass http://127.0.0.1:8085/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # توجيه اتصالات WebSockets اللحظية للإشعارات
    location /ws {
        proxy_pass http://127.0.0.1:8085/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}

# خادم الهوية (Keycloak IAM)
server {
    listen 443 ssl;
    http2 on;
    server_name auth.skystore.local;

    ssl_certificate /etc/nginx/certs/skystore.crt;
    ssl_certificate_key /etc/nginx/certs/skystore.key;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
