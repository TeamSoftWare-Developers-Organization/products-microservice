name: Microservices CI Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'auth-service/**'
      - 'orders-service/**'
      - 'Products-Service/**'
      - 'shipping-service/**'
      - 'cart-service/**'
      - 'payment-service/**'
      - 'warehouse-service/**'
      - 'api-gateway/**'
      - 'docker-compose.yml'
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - orders-service
          - Products-Service
          - shipping-service
          - cart-service
          - api-gateway

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package.json

      - name: Install Dependencies
        run: |
          cd ${{ matrix.service }}
          npm install

      - name: Run Linter
        run: |
          cd ${{ matrix.service }}
          npm run lint --if-present

      - name: Run Tests
        run: |
          cd ${{ matrix.service }}
          npm run test --if-present

  build-containers:
    name: Build Container Images
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Services Images
        run: |
          docker compose build --parallel
