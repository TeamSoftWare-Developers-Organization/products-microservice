global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    retries 3
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

# --- لوحة الإحصائيات وتصدير مقاييس Prometheus ---
frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats admin if TRUE
    # تصدير مقاييس Prometheus المدمجة
    http-request use-service prometheus-exporter if { path /metrics }

# --- واجهة الاتصال الموحدة بقواعد بيانات MariaDB Galera ---
frontend mariadb_galera_front
    bind *:3306
    mode tcp
    default_backend mariadb_galera_back

# --- عقد عنقود Galera الثلاث ---
backend mariadb_galera_back
    mode tcp
    balance roundrobin
    option tcp-check
    # العقدة الأولى أساسية (Primary Writer) لتفادي التعارض المتزامن
    server node1 skystore-mariadb-node1:3306 check inter 3s rise 2 fall 3
    # العقدتان 2 و 3 كعقد احتياطية وتبديل تلقائي فوري (Hot Standby / Automatic Failover)
    server node2 skystore-mariadb-node2:3306 check inter 3s rise 2 fall 3 backup
    server node3 skystore-mariadb-node3:3306 check inter 3s rise 2 fall 3 backup
