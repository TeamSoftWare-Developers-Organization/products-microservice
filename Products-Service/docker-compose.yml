services:
  # 1. قاعدة البيانات
  products-db:
    image: postgres:16-alpine
    container_name: products-db
    restart: always
    networks:
      - app-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zafer4519932093
      POSTGRES_DB: products_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d products_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 1.1 قاعدة بيانات الطلبات
  orders-db:
    image: postgres:16-alpine
    container_name: orders-db
    restart: always
    networks:
      - app-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zafer4519932093
      POSTGRES_DB: orders_db
    volumes:
      - orders_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d orders_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-ms
    restart: always
    networks:
      - app-network
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2.1 Zipkin (للتتبع الموزع)
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    restart: always
    networks:
      - app-network
    ports:
      - "9411:9411"

  # 3. خدمة المنتجات
  products-service:
    build: .
    container_name: products-ms
    restart: always
    networks:
      - app-network
    depends_on:
      products-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_HOST: products-db
      DATABASE_NAME: products_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: zafer4519932093
      RABBITMQ_URL: amqp://rabbitmq:5672
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      JWT_SECRET: super_secret_key_123

  # 3.1 خدمة الطلبات
  orders-service:
    build:
      context: ../orders-service
      dockerfile: Dockerfile
    container_name: orders-ms
    restart: always
    networks:
      - app-network
    depends_on:
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_HOST: orders-db
      DATABASE_NAME: orders_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: zafer4519932093
      RABBITMQ_URL: amqp://rabbitmq:5672
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans

  # 4.1 بوابة الخدمات العقدية (NestJS API Gateway)
  api-gateway-ms:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway-ms
    restart: always
    networks:
      - app-network
    depends_on:
      - products-service
      - orders-service
      - auth-service
    environment:
      NODE_ENV: production
      JWT_SECRET: super_secret_key_123

  # 4. بوابة الخدمات (NGINX API Gateway)
  api-gateway:
    image: nginx:latest
    container_name: api-gateway
    restart: always
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - products-service
      - orders-service
      - auth-service
      - notification-service
      - shipping-service
      - cart-service
      - warehouse-service
      - minio
      - api-gateway-ms
    ports:
      - "8085:80"


  # 1.3 قاعدة بيانات الهوية
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: always
    networks:
      - app-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zafer4519932093
      POSTGRES_DB: auth_db
    volumes:
      - auth_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d auth_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3.2 خدمة الهوية
  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    container_name: auth-ms
    restart: always
    networks:
      - app-network
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_HOST: auth-db
      DATABASE_NAME: auth_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: zafer4519932093
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: super_secret_key_123

  # 3.3 خدمة الإشعارات
  notification-service:
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    container_name: notification-ms
    restart: always
    networks:
      - app-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://rabbitmq:5672
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans

  # 1.4 قاعدة بيانات الشحن
  shipping-db:
    image: postgres:16-alpine
    container_name: shipping-db
    restart: always
    networks:
      - app-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zafer4519932093
      POSTGRES_DB: shipping_db
    volumes:
      - shipping_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d shipping_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3.4 خدمة الشحن واللوجستيات
  shipping-service:
    build:
      context: ../shipping-service
      dockerfile: Dockerfile
    container_name: shipping-ms
    restart: always
    networks:
      - app-network
    depends_on:
      shipping-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_HOST: shipping-db
      DATABASE_NAME: shipping_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: zafer4519932093
      RABBITMQ_URL: amqp://rabbitmq:5672

  # 5. MinIO Object Storage
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: always
    networks:
      - app-network
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 6. Redis for Cart Service
  cart-redis:
    image: redis:7-alpine
    container_name: cart-redis-ms
    restart: always
    networks:
      - app-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 7. Cart Service
  cart-service:
    build:
      context: ../cart-service
      dockerfile: Dockerfile
    container_name: cart-ms
    restart: always
    networks:
      - app-network
    ports:
      - "3007:3007"
    depends_on:
      cart-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3007
      REDIS_HOST: cart-redis
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: super_secret_key_123

  # 8. PostgreSQL for Warehouse Service
  warehouse-db:
    image: postgres:16-alpine
    container_name: warehouse-db
    restart: always
    networks:
      - app-network
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zafer4519932093
      POSTGRES_DB: warehouse_db
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 9. Warehouse Service
  warehouse-service:
    build:
      context: ../warehouse-service
      dockerfile: Dockerfile
    container_name: warehouse-ms
    restart: always
    networks:
      - app-network
    ports:
      - "3008:3008"
    depends_on:
      warehouse-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3008
      DATABASE_HOST: warehouse-db
      DATABASE_NAME: warehouse_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: zafer4519932093
      RABBITMQ_URL: amqp://rabbitmq:5672

  # 10. Payment Database
  payment-db:
    image: postgres:16-alpine
    container_name: payment-db
    restart: always
    networks:
      - app-network
    ports:
      - "5438:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zafer4519932093
      POSTGRES_DB: payment_db
    volumes:
      - payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 10.1 Payment Service
  payment-service:
    build:
      context: ../payment-service
      dockerfile: Dockerfile
    container_name: payment-ms
    restart: always
    networks:
      - app-network
    ports:
      - "3009:3009"
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3009
      DATABASE_HOST: payment-db
      DATABASE_NAME: payment_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: zafer4519932093
      RABBITMQ_URL: amqp://rabbitmq:5672


networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  orders_data:
  auth_data:
  shipping_data:
  minio_data:
  warehouse_data:
  payment_data:

