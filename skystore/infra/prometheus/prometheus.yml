global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['skystore-alertmanager:9093']

rule_files:
  - '/etc/prometheus/alert_rules.yml'

scrape_configs:
  - job_name: 'spring-boot-core'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.containers.internal:8085']

  - job_name: 'rust-engine'
    static_configs:
      - targets: ['host.containers.internal:50051']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['skystore-alertmanager:9093']

  - job_name: 'scdf-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['skystore-dataflow:9393']

  - job_name: 'skipper-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['skystore-skipper:7577']

  - job_name: 'haproxy-galera'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['skystore-haproxy:8404']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
