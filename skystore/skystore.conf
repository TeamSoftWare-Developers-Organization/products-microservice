# التوجيه التلقائي إلى HTTPS
server {
    listen 80;
    server_name api.skystore.local auth.skystore.local app.skystore.local;
    return 301 https://$host$request_uri;
}

# خادم الـ API (Spring Boot GraphQL & WebSockets)
server {
    listen 443 ssl;
    http2 on;
    server_name api.skystore.local;

    ssl_certificate /etc/nginx/certs/skystore.crt;
    ssl_certificate_key /etc/nginx/certs/skystore.key;

    # توجيه طلبات GraphQL
    location /graphql {
        proxy_pass http://172.17.144.1:8085/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # توجيه واجهة GraphiQL
    location /graphiql {
        proxy_pass http://172.17.144.1:8085/graphiql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # توجيه مؤشرات Actuator وPrometheus
    location /actuator {
        proxy_pass http://172.17.144.1:8085/actuator;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # توجيه اتصالات WebSockets اللحظية للإشعارات
    location /ws {
        proxy_pass http://172.17.144.1:8085/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}

# خادم الهوية (Keycloak IAM)
server {
    listen 443 ssl;
    http2 on;
    server_name auth.skystore.local;

    ssl_certificate /etc/nginx/certs/skystore.crt;
    ssl_certificate_key /etc/nginx/certs/skystore.key;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# خادم توجيه gRPC لمحرك معالجة الوسائط (Rust Media Processor)
server {
    listen 50051 ssl;
    http2 on;
    server_name grpc.skystore.local api.skystore.local;

    ssl_certificate /etc/nginx/certs/skystore.crt;
    ssl_certificate_key /etc/nginx/certs/skystore.key;

    location / {
        grpc_pass grpc://127.0.0.1:50051;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
    }
}

# خادم واجهة الويب ولوحة التحكم (Next.js Web UI & Backoffice)
server {
    listen 443 ssl;
    http2 on;
    server_name app.skystore.local;

    ssl_certificate /etc/nginx/certs/skystore.crt;
    ssl_certificate_key /etc/nginx/certs/skystore.key;

    location / {
        proxy_pass http://skystore-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

