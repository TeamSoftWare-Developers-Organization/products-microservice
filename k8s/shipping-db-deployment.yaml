apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping-db
  template:
    metadata:
      labels:
        app: shipping-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "zafer4519932093"
            - name: POSTGRES_DB
              value: "shipping_db"
          volumeMounts:
            - name: shipping-db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: shipping-db-data
          persistentVolumeClaim:
            claimName: shipping-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: shipping-db
spec:
  selector:
    app: shipping-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
