services:
  # 1. قاعدة البيانات
  products-db:
    image: postgres:16-alpine
    container_name: products-db
    restart: always
    networks:
      - app-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zafer4519932093
      POSTGRES_DB: products_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d products_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 1.1 قاعدة بيانات الطلبات
  orders-db:
    image: postgres:16-alpine
    container_name: orders-db
    restart: always
    networks:
      - app-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zafer4519932093
      POSTGRES_DB: orders_db
    volumes:
      - orders_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d orders_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-ms
    restart: always
    networks:
      - app-network
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2.1 Zipkin (للتتبع الموزع)
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    restart: always
    networks:
      - app-network
    ports:
      - "9411:9411"

  # 3. خدمة المنتجات
  products-service:
    build: .
    container_name: products-ms
    restart: always
    networks:
      - app-network
    depends_on:
      products-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_HOST: products-db
      DATABASE_NAME: products_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: zafer4519932093
      RABBITMQ_URL: amqp://rabbitmq:5672
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans

  # 3.1 خدمة الطلبات
  orders-service:
    build:
      context: ../orders-service
      dockerfile: Dockerfile
    container_name: orders-ms
    restart: always
    networks:
      - app-network
    depends_on:
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_HOST: orders-db
      DATABASE_NAME: orders_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: zafer4519932093
      RABBITMQ_URL: amqp://rabbitmq:5672
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans

  # 4. بوابة الخدمات (API Gateway)
  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: always
    networks:
      - app-network
    depends_on:
      - products-service
      - orders-service
      - zipkin
    environment:
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    ports:
      - "8080:80"

  # 1.3 قاعدة بيانات الهوية
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: always
    networks:
      - app-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zafer4519932093
      POSTGRES_DB: auth_db
    volumes:
      - auth_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d auth_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3.2 خدمة الهوية
  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    container_name: auth-ms
    restart: always
    networks:
      - app-network
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_HOST: auth-db
      DATABASE_NAME: auth_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: zafer4519932093
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: super_secret_key_123

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  orders_data:
  auth_data:
