name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ==========================================
  # 1. CI: Validate & Build Backend Microservices
  # ==========================================
  ci-backend:
    name: CI - Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - Products-Service
          - cart-service
          - orders-service
          - payment-service
          - shipping-service
          - warehouse-service
          - notification-service
          - api-gateway
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: '${{ matrix.service }}/package-lock.json'

      - name: Install Dependencies
        working-directory: ./${{ matrix.service }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run Lint / Type Check
        working-directory: ./${{ matrix.service }}
        run: |
          npm run lint --if-present || true

      - name: Run Unit Tests
        working-directory: ./${{ matrix.service }}
        run: |
          npm test --if-present -- --passWithNoTests || true

      - name: Build Service
        working-directory: ./${{ matrix.service }}
        run: |
          npm run build --if-present

  # ==========================================
  # 2. CI: Validate & Build Frontend (Next.js)
  # ==========================================
  ci-frontend:
    name: CI - Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Run Lint
        working-directory: ./frontend
        run: |
          npm run lint --if-present || true

      - name: Build Frontend Application
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: 'http://localhost:8080'
          NEXT_PUBLIC_WS_URL: 'ws://localhost:3004'
          NODE_ENV: production
        run: |
          npm run build

  # ==========================================
  # 3. CI: Validate Kubernetes & Docker Configurations
  # ==========================================
  validate-configs:
    name: Validate K8s & Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config -q || docker-compose config -q

      - name: Validate Kubernetes Manifests
        run: |
          echo "Validating Kubernetes YAML files syntax..."
          for file in k8s/*.yaml; do
            echo "Checking $file"
            python3 -c "import yaml; yaml.safe_load_all(open('$file'))"
          done
          echo "All K8s manifests syntax is valid!"

  # ==========================================
  # 4. CD: Build and Push Docker Images to GHCR
  # ==========================================
  cd-build-push-images:
    name: CD - Build & Push (${{ matrix.service.name }})
    needs: [ci-backend, ci-frontend, validate-configs]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            context: ./auth-service
            dockerfile: ./auth-service/Dockerfile
          - name: products-service
            context: ./Products-Service
            dockerfile: ./Products-Service/Dockerfile
          - name: cart-service
            context: ./cart-service
            dockerfile: ./cart-service/Dockerfile
          - name: orders-service
            context: ./orders-service
            dockerfile: ./orders-service/Dockerfile
          - name: payment-service
            context: ./payment-service
            dockerfile: ./payment-service/Dockerfile
          - name: shipping-service
            context: ./shipping-service
            dockerfile: ./shipping-service/Dockerfile
          - name: warehouse-service
            context: ./warehouse-service
            dockerfile: ./warehouse-service/Dockerfile
          - name: notification-service
            context: ./notification-service
            dockerfile: ./notification-service/Dockerfile
          - name: api-gateway
            context: ./api-gateway
            dockerfile: ./api-gateway/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
