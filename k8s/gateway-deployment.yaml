apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:v2 # Using v2 for the 504 fix
          imagePullPolicy: Always
          files: # None needed beyond code
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: NODE_ENV
              value: "production"
          # Since code uses hardcoded names, we must ensure Services exist with those names:
          # products-ms:3002
          # orders-ms:3003
          # auth-ms:3001
