events {}

http {
    client_max_body_size 20M;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream api_gateway { server api-gateway-ms:8080; }
    upstream products_service { server products-ms:3002; }
    upstream auth_service { server auth-ms:3001; }
    upstream notification_service { server notification-ms:3004; }
    upstream minio_service { server minio:9000; }

    server {
        listen 80;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"microstore-edge"}';
        }



        # User administration belongs to auth-ms, not the generic API gateway.
        location /api/users {
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type $content_type;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # Keep multipart upload as an untouched byte stream.
        location = /api/products/upload {
            proxy_pass http://products_service/api/products/upload;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /api/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials 'true' always;
                add_header Access-Control-Allow-Methods 'GET,POST,PUT,PATCH,DELETE,OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Authorization,Content-Type,Accept,X-Requested-With,Bypass-Tunnel-Reminder' always;
                add_header Access-Control-Max-Age 86400 always;
                return 204;
            }

            proxy_pass http://api_gateway/api/;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Access-Control-Allow-Methods 'GET,POST,PUT,PATCH,DELETE,OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Authorization,Content-Type,Accept,X-Requested-With,Bypass-Tunnel-Reminder' always;
        }

        location /socket.io/ {
            proxy_pass http://notification_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        location /uploads/ {
            proxy_pass http://minio_service/products/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            expires 30d;
            add_header Cache-Control 'public, max-age=2592000';
            add_header Access-Control-Allow-Origin '*' always;
        }
    }
}
